[package]
name = "pezpallet-komite"
version = "1.0.0"
description = "The committee the People chain seated, with its trust, as the Asset Hub sees it"
authors.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
documentation.workspace = true

[dependencies]
codec = { workspace = true, default-features = false, features = ["derive"] }
pezframe-benchmarking = { workspace = true, optional = true }
pezframe-support = { default-features = false, workspace = true }
pezframe-system = { default-features = false, workspace = true }
pezsp-runtime = { default-features = false, workspace = true }
scale-info = { default-features = false, features = [
	"derive",
], workspace = true }

[dev-dependencies]
pezsp-io = { workspace = true, features = ["std"] }

[features]
default = ["std"]
std = [
	"codec/std",
	"pezframe-benchmarking?/std",
	"pezframe-support/std",
	"pezframe-system/std",
	"pezsp-io/std",
	"pezsp-runtime/std",
	"scale-info/std",
]
runtime-benchmarks = [
	"pezframe-benchmarking/runtime-benchmarks",
	"pezframe-support/runtime-benchmarks",
	"pezframe-system/runtime-benchmarks",
	"pezsp-io/runtime-benchmarks",
	"pezsp-runtime/runtime-benchmarks",
]
try-runtime = [
	"pezframe-benchmarking?/try-runtime",
	"pezframe-support/try-runtime",
	"pezframe-system/try-runtime",
	"pezsp-runtime/try-runtime",
]
