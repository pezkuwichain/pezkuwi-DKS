[package]
name = "pezpallet-pez-rewards"
version = "1.0.0"
description = "PezkuwiChain Trust Score Based Rewards Distribution System"
authors.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
documentation.workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { workspace = true, default-features = false, features = ["derive"] }
scale-info = { default-features = false, features = [
	"derive",
], workspace = true }
serde = { version = "1.0", default-features = false, features = [
	"derive",
], optional = true }

log = { default-features = false, workspace = true }
pezframe-support = { default-features = false, workspace = true }
pezframe-system = { default-features = false, workspace = true }
pezsp-runtime = { default-features = false, workspace = true }
pezsp-std = { default-features = false, workspace = true }

# The pot is on another chain: every payment leaves here as an XCM instruction.
xcm = { workspace = true, default-features = false }

# Test ve Benchmark için Gerekli İsteğe Bağlı Bağımlılıklar
pezframe-benchmarking = { optional = true, workspace = true }
pezsp-core = { workspace = true, default-features = false, optional = true }
pezsp-io = { workspace = true, default-features = false, optional = true }

[dev-dependencies]
# The trust roll and the parliamentary roll reach this pallet through traits, so the tests
# stand up neither the trust pallet nor welati -- only a chain to run blocks on.
pezsp-core = { workspace = true, default-features = false, features = ["std"] }
pezsp-io = { workspace = true, default-features = false, features = ["std"] }
xcm = { workspace = true, default-features = false, features = ["std"] }

[features]
default = ["std"]
std = [
	"codec/std",
	"log/std",
	"pezframe-benchmarking?/std",
	"pezframe-support/std",
	"pezframe-system/std",
	"pezsp-core?/std",
	"pezsp-io?/std",
	"pezsp-runtime/std",
	"pezsp-std/std",
	"scale-info/std",
	"serde",
	"serde?/std",
	"xcm/std",
]
runtime-benchmarks = [
	"pezframe-benchmarking/runtime-benchmarks",
	"pezframe-support/runtime-benchmarks",
	"pezframe-system/runtime-benchmarks",
	"pezsp-core",
	"pezsp-io",
	"pezsp-io?/runtime-benchmarks",
	"pezsp-runtime/runtime-benchmarks",
	"xcm/runtime-benchmarks",
]
try-runtime = [
	"pezframe-benchmarking?/try-runtime",
	"pezframe-support/try-runtime",
	"pezframe-system/try-runtime",
	"pezsp-runtime/try-runtime",
]
serde = [
	"codec/serde",
	"dep:serde",
	"log/serde",
	"pezframe-benchmarking?/serde",
	"pezsp-core?/serde",
	"pezsp-runtime/serde",
	"scale-info/serde",
]
experimental = []
with-tracing = []
tuples-96 = []
