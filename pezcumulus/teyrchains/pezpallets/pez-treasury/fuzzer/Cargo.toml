[package]
name = "pezpallet-pez-treasury-fuzzer"
version = "0.0.0"
publish = false
license = "Apache-2.0"
description = "Fuzzer for the PEZ release schedule and the two pots it pays into"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true

[lints]
workspace = true

[[bin]]
name = "schedule"
path = "src/schedule.rs"

[dependencies]
honggfuzz = { workspace = true }

pezpallet-pez-treasury = { features = [
	"fuzzing",
], workspace = true, default-features = true }

pezframe-support = { workspace = true, default-features = true }
pezframe-system = { workspace = true, default-features = true }
pezsp-core = { workspace = true, default-features = true }
pezsp-runtime = { workspace = true, default-features = true }

rand = { features = ["small_rng"], workspace = true, default-features = true }

[features]
# The schedule's invariants are the pallet's `try_state`, which only exists under `try-runtime`.
# Opt-in so it does not reach every workspace build; fuzz.yml builds with it, and a fuzz build
# without it refuses to compile.
try-runtime = [
	"pezframe-support/try-runtime",
	"pezframe-system/try-runtime",
	"pezpallet-pez-treasury/try-runtime",
	"pezsp-runtime/try-runtime",
]
