[package]
name = "people-pezkuwichain-integration-tests"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "People Pezkuwichain runtime integration tests with xcm-pez-emulator"
publish = false
documentation.workspace = true
repository = { workspace = true }
homepage = { workspace = true }

[lints]
workspace = true

[dependencies]
codec = { workspace = true }

# Bizinikiwi
pezframe-support = { workspace = true }
pezpallet-assets = { workspace = true }
pezpallet-balances = { workspace = true }
pezpallet-identity = { workspace = true }
pezpallet-identity-kyc = { workspace = true }
pezpallet-message-queue = { workspace = true }
pezpallet-pez-treasury = { workspace = true }
pezpallet-staking-async-rc-client = { workspace = true }
pezpallet-tnpos = { workspace = true }
pezpallet-xcm = { workspace = true }
pezsp-runtime = { workspace = true }

# Pezkuwi
xcm = { workspace = true }
xcm-executor = { workspace = true }

# Pezcumulus
asset-test-pezutils = { workspace = true, default-features = true }
emulated-integration-tests-common = { workspace = true }
pezkuwichain-system-emulated-network = { workspace = true }
teyrchains-common = { workspace = true, default-features = true }

[features]
