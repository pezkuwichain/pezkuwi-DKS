[build]
# Off here, not only in CI. All three workflows already set `CARGO_INCREMENTAL: "0"`; a local
# shell did not, and the cache it leaves is the largest single thing on this repo's disk --
# 86 GB of a 201 GB `target`, twice, on a machine whose real budget is the Windows drive the
# WSL image sits on rather than the size Linux reports. Nothing local needs the rebuild speed
# it buys: heavy builds belong on CI or the build VPS, and what stays here is single-package
# checks. Note `[env]` is the wrong place for this -- that section sets the environment of
# the processes cargo spawns, not cargo's own configuration.
incremental = false
rustdocflags = [
	"-Dwarnings",
	"-Arustdoc::redundant_explicit_links", # stylistic
]

[env]
# Needed for musl builds so user doesn't have to install musl-tools.
CC_x86_64_unknown_linux_musl = { value = ".cargo/musl-gcc", force = true, relative = true }
CXX_x86_64_unknown_linux_musl = { value = ".cargo/musl-g++", force = true, relative = true }
CARGO_WORKSPACE_ROOT_DIR = { value = "", relative = true }
SQLX_OFFLINE = "true"
# `--allow-undefined` used to be set here, but this file cannot tell the wasm runtime build
# apart from the riscv one and `rust-lld` rejects the argument when linking the riscv blob.
# wasm-builder now adds it on the wasm path where it belongs.

[net]
retry = 5
# git-fetch-with-cli = true # commented because there is a risk that a runner can be banned by github
