[package]
name = "revm-precompile"
version = "25.0.0"
edition = "2021"
authors = ["Dragan Rakita <dragan0rakita@gmail.com>"]
description = "Revm Precompiles - Ethereum compatible precompiled contracts"
readme = "README.md"
keywords = ["blockchain", "ethereum", "evm", "no_std", "revm"]
license = "MIT"
repository = "https://github.com/bluealloy/revm"
publish = false

# Vendored from revm-precompile 25.0.0, which revm 27 (pezpallet-revive) uses, without its
# `libsecp256k1` feature: the optional parity libsecp256k1 backend for ecrecover. libsecp256k1
# 0.7.2 is unmaintained (RUSTSEC-2025-0161), and because `std` named it as a weak dependency
# feature (`libsecp256k1?/std`), Cargo kept it in Cargo.lock although nothing enables it.
# ecrecover runs on k256, or on secp256k1 when that feature is on, exactly as before. The
# `parity_libsecp256k1` module and its cfg branches are removed; nothing else is changed.

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "revm_precompile"
path = "src/lib.rs"

[[bench]]
name = "bench"
path = "bench/main.rs"
harness = false
required-features = ["secp256k1"]

[dependencies]
ark-bls12-381 = { version = "0.5", features = ["curve"], default-features = false }
ark-bn254 = { version = "0.5", features = ["curve"], default-features = false }
ark-ec = { version = "0.5", default-features = false }
ark-ff = { version = "0.5", features = ["asm"], default-features = false }
ark-serialize = { version = "0.5", default-features = false }
arrayref = { version = "0.3.6" }
aurora-engine-modexp = { version = "1.2", default-features = false }
blst = { version = "0.3.15", optional = true }
bn = { version = "0.6", optional = true, default-features = false, package = "substrate-bn" }
c-kzg = { version = "2.1.1", features = ["ethereum_kzg_settings"], optional = true, default-features = false }
cfg-if = { version = "1.0", default-features = false }
k256 = { version = "0.13.4", features = ["ecdsa"], default-features = false }
kzg-rs = { version = "0.2.7", optional = true, default-features = false }
once_cell = { version = "1.21", features = ["alloc"], default-features = false }
p256 = { version = "0.13.2", features = ["ecdsa"], default-features = false }
primitives = { version = "20.1.0", default-features = false, package = "revm-primitives" }
ripemd = { version = "0.1.3", default-features = false }
rug = { version = "1.27.0", features = ["integer"], optional = true, default-features = false }
secp256k1 = { version = "0.31.0", features = [
	"alloc",
	"global-context",
	"rand",
	"recovery",
], optional = true, default-features = false }
sha2 = { version = "0.10.9", default-features = false }

[dev-dependencies]
ark-std = { version = "0.5", default-features = false }
criterion = { version = "2.10", package = "codspeed-criterion-compat" }
rand = { version = "0.9", features = ["std"] }
rstest = { version = "0.25.0" }

[features]
asm-keccak = ["primitives/asm-keccak"]
asm-sha2 = ["sha2/asm"]
blst = ["dep:blst"]
bn = ["dep:bn"]
c-kzg = ["dep:c-kzg"]
default = ["blst", "c-kzg", "portable", "secp256k1", "std"]
gmp = ["dep:rug"]
hashbrown = ["primitives/hashbrown"]
kzg-rs = ["dep:kzg-rs"]
portable = ["blst?/portable", "c-kzg?/portable"]
secp256k1 = ["dep:secp256k1"]
std = [
	"ark-bls12-381/std",
	"ark-bn254/std",
	"ark-ec/std",
	"ark-ff/std",
	"ark-serialize/std",
	"ark-std/std",
	"aurora-engine-modexp/std",
	"c-kzg?/std",
	"k256/std",
	"once_cell/std",
	"p256/std",
	"primitives/std",
	"ripemd/std",
	"rug?/std",
	"secp256k1?/std",
	"sha2/std",
]

[lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[lints.rust.rust_2018_idioms]
level = "deny"
priority = -1

[lints.rustdoc]
all = "warn"
