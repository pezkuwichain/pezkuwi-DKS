[package]
name = "ruint"
description = "Unsigned integer type with const-generic bit length"
version = "1.20.0"
keywords = ["uint"]
categories = ["mathematics"]
readme = "README.md"
edition = "2024"
rust-version = "1.90"
authors = ["Remco Bloemen <remco@wicked.ventures>"]
license = "MIT"
homepage = "https://github.com/alloy-rs/ruint"
repository = "https://github.com/alloy-rs/ruint"
publish = false

# Vendored from ruint 1.20.0 (latest), which alloy-primitives and nybbles use, without its
# `ark-ff` and `ark-ff-04` features and their conversion modules (src/support/ark_ff.rs,
# src/support/ark_ff_04.rs). Nothing here enables them, but their optional ark-ff 0.3 and 0.4
# dependencies sat in Cargo.lock regardless, and both depend on derivative, which is
# unmaintained (RUSTSEC-2024-0388). Everything else is unchanged.
#
# Unlike the other vendored crates this one is excluded from the workspace rather than a
# member: ruint has three dozen integration features (pyo3, diesel, sqlx, a nightly-only
# `generic_const_exprs`, ...) that `cargo doc --all-features --workspace` would switch on,
# and its tests need dev-dependencies the workspace does not otherwise carry. As a
# non-member it builds like the registry crate it replaces: only the features alloy asks for,
# no tests, no dev-dependencies in Cargo.lock. Its own tests run with
# `cargo test --manifest-path vendor/ruint/Cargo.toml`.

[dependencies]
ruint-macro = { version = "1.2.1" }

thiserror = { version = "2.0", optional = true }

# support
alloy-rlp = { version = "0.3", optional = true, default-features = false }
arbitrary = { version = "1", optional = true, default-features = false }
ark-ff-05 = { version = "0.5.0", package = "ark-ff", optional = true, default-features = false }
ark-ff-06 = { version = "0.6.0", package = "ark-ff", optional = true, default-features = false }
bigdecimal = { version = "0.4", optional = true, default-features = false }
bincode-2 = { version = "2", package = "bincode", optional = true, default-features = false }
bn-rs = { version = "0.2", optional = true, default-features = true }
bytemuck = { version = "1.13.1", optional = true, default-features = false }
der = { version = "0.7", optional = true, default-features = false, features = ["alloc"] }
ethereum_ssz = { version = "0.5.3", optional = true, default-features = false }
fastrlp-03 = { version = "0.3", package = "fastrlp", optional = true, default-features = false, features = [
	"alloc",
] }
fastrlp-04 = { version = "0.4", package = "fastrlp", optional = true, default-features = false, features = [
	"alloc",
] }
num-bigint = { version = "0.4", optional = true, default-features = false }
num-integer = { version = "0.1", optional = true, default-features = false }
num-traits = { version = "0.2.16", optional = true, default-features = false }
parity-scale-codec = { version = "3", optional = true, default-features = false, features = [
	"derive",
	"max-encoded-len",
] }
primitive-types = { version = "0.12", optional = true, default-features = false }
proptest = { version = "1", optional = true, default-features = false, features = ["no_std"] }
pyo3 = { version = "0.25", optional = true, default-features = false }
quickcheck = { version = "1", optional = true, default-features = false }
rand-08 = { version = "0.8", package = "rand", optional = true, default-features = false }
rand-09 = { version = "0.9", package = "rand", optional = true, default-features = false }
rkyv = { version = "0.8", optional = true }
rlp = { version = "0.5", optional = true, default-features = false }
serde_core = { version = "1.0.211", optional = true, default-features = false }
subtle = { version = "2.6.1", optional = true, default-features = false }
valuable = { version = "0.1", optional = true, default-features = false }
zeroize = { version = "1.6", optional = true, default-features = false }

# postgres
bytes = { version = "1.4", optional = true }
postgres-types = { version = "0.2", optional = true }

# diesel
diesel = { version = "2.2", optional = true }

# sqlx
sqlx-core = { version = "0.8.2", optional = true }

# borsh
borsh = { version = "1.5", optional = true, default-features = false }

[dev-dependencies]
ruint = { path = ".", features = ["arbitrary", "proptest"] }

ark-bn254-05 = { version = "0.5.0", package = "ark-bn254" }
ark-bn254-06 = { version = "0.6.0", package = "ark-bn254" }

rand-09 = { version = "0.9", package = "rand" }

approx = "0.5"
bincode = "1.3"
hex = "0.4"
hex-literal = "1.0"
serde_json = "1.0"

# borsh
borsh = { version = "1.5", features = ["derive"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1"
postgres = "0.19"

[target.'cfg(target_family = "wasm")'.dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[features]
default = ["std"]
std = [
	"alloc",
	"alloy-rlp?/std",
	"ark-ff-05?/std",
	"ark-ff-06?/std",
	"bytes?/std",
	"fastrlp-03?/std",
	"fastrlp-04?/std",
	"num-bigint?/std",
	"num-integer?/std",
	"num-traits?/std",
	"parity-scale-codec?/std",
	"primitive-types?/std",
	"proptest?/std",
	"rand-08?/std",
	"rand-08?/std_rng",
	"rand-09?/std",
	"rand-09?/thread_rng",
	"rlp?/std",
	"serde_core?/std",
	"valuable?/std",
	"zeroize?/std",
]
alloc = [
	"proptest?/alloc",
	"rand-08?/alloc",
	"rand-09?/alloc",
	"serde_core?/alloc",
	"valuable?/alloc",
	"zeroize?/alloc",
]

# nightly-only features
nightly = []
generic_const_exprs = ["nightly"]

# support
alloy-rlp = ["alloc", "dep:alloy-rlp"]
arbitrary = ["dep:arbitrary", "std"]
ark-ff-05 = ["dep:ark-ff-05"]
ark-ff-06 = ["dep:ark-ff-06"]
bigdecimal = ["dep:bigdecimal", "num-bigint"]
bincode-2 = ["dep:bincode-2"]
bn-rs = ["dep:bn-rs", "std"]
borsh = ["dep:borsh"]
bytemuck = ["dep:bytemuck"]
der = ["alloc", "dep:der"]
diesel = ["dep:diesel", "dep:thiserror", "std"]
fastrlp = ["alloc", "dep:fastrlp-03"]
fastrlp-04 = ["alloc", "dep:fastrlp-04"]
num-bigint = ["alloc", "dep:num-bigint"]
num-integer = ["alloc", "dep:num-integer", "num-traits"]
num-traits = ["alloc", "dep:num-traits"]
parity-scale-codec = ["alloc", "dep:parity-scale-codec"]
postgres = ["dep:bytes", "dep:postgres-types", "dep:thiserror", "std"]
primitive-types = ["dep:primitive-types"]
proptest = ["alloc", "dep:proptest"]
pyo3 = ["dep:pyo3", "std"]
quickcheck = ["dep:quickcheck", "std"]
rand = ["dep:rand-08"]
rand-09 = ["dep:rand-09"]
rkyv = ["alloc", "dep:rkyv"]
rlp = ["alloc", "dep:rlp"]
serde = ["alloc", "dep:serde_core"]
sqlx = ["dep:sqlx-core", "dep:thiserror", "std"]
ssz = ["dep:ethereum_ssz", "std"]
subtle = ["dep:subtle"]
valuable = ["dep:valuable"]
zeroize = ["dep:zeroize"]

[lib]
bench = false
