[package]
name = "usdt-bridge"
version = "0.1.0"
edition.workspace = true
description = "Custodial USDT Bridge: Polkadot Asset Hub <-> Pezkuwi Asset Hub (USDT.p)"
authors = ["Dijital Kurdistan Tech Institute"]
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
# A service binary deployed to the fleet, not a library anyone links against.
publish = false

[lints]
workspace = true

[[bin]]
name = "usdt-bridge"
path = "src/main.rs"

[[bin]]
name = "pezbridge-bot"
path = "src/bin/pezbridge_bot.rs"

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["full"] }

# Both chains are reached through Pezkuwi's own subxt fork: `BizinikiwiConfig` for Polkadot
# Asset Hub, `PezkuwiConfig` for ours. It is the copy this repository vendors, resolved against
# the root lockfile, so the bridge runs on the same dependency graph the rest of the tree is
# audited on rather than on a published 0.44.0 and a lockfile of its own.
#
# Not yet enabled: `reconnecting-rpc-client`. It is the feature that would put an
# application-layer ping under the subscriptions, which is the root cause of the July stall;
# taking it means reconciling library-level reconnection with the manual reconnect loop the
# bridge already has.
pezkuwi-subxt = { workspace = true, default-features = true }
pezkuwi-subxt-signer = { workspace = true, features = ["sr25519"] }

# Crypto: wallet generation and SS58 rendering. `std` for `Pair::generate_with_phrase`.
pezsp-core = { workspace = true, features = ["std"] }

# Serialization
serde = { workspace = true, default-features = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true }

# CLI
clap = { workspace = true, features = ["derive"] }

# Logging
tracing = { workspace = true, default-features = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Hex encoding
hex = { workspace = true, default-features = true }

# Date/time
chrono = { workspace = true, features = ["serde"] }

# Telegram Bot API HTTP client (pezbridge-bot only). rustls instead of native-tls/OpenSSL so
# this cross-compiles cleanly to a static musl binary (no OpenSSL sysroot needed for the target).
reqwest = { workspace = true }

# Error handling
anyhow = { workspace = true, default-features = true }

# Simple file-based storage (no native compilation needed)
# Database tracking via JSON files for simplicity
