# cargo-deny v2 configuration for Pezkuwi SDK
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
	{ triple = "wasm32-unknown-unknown" },
	{ triple = "x86_64-unknown-linux-gnu" },
	{ triple = "x86_64-unknown-linux-musl" },
]
# all-features prevents krates 0.20+ from panicking with "unable to locate std"
# on workspace crates that have a std feature but don't enable it by default.
all-features = true

# Advisory database - check for known vulnerabilities
# In v2: all vulnerability/unsound/notice advisories automatically emit errors.
# Use `ignore` to suppress specific advisories.
[advisories]
yanked = "warn"
# Checked, not switched off. "none" suppressed the whole class, which meant it also covered
# any unmaintained crate we might add ourselves, and the reason recorded for it -- that these
# are transitive upstream dependencies we cannot replace -- was measurably wrong: every one
# of the seven listed below is declared in our own workspace manifest. "workspace" keeps the
# check on the surface we can actually act on. The transitive-only ones stay out of scope
# because we cannot act on them, and a gate that reports what you cannot fix teaches you to
# skim it. An eighth unmaintained crate now fails the run instead of arriving unannounced.
unmaintained = "workspace"
ignore = [
	# ── wasmtime ──────────────────────────────────────────────────────────────
	# Nothing is exempted here. The block that used to sit here listed fourteen wasmtime
	# advisories and justified them with "wasmtime is pinned at 37.x"; the lock says 36.0.13
	# and cargo-deny reported every one of them as "no crate matched advisory criteria",
	# on our graph and on main's. Fifteen dead entries also meant fifteen warnings on every
	# run, which is how a live one would have gone unread. Re-add an entry only with the
	# advisory that actually fires and the reason it is tolerable.

	# ── unmaintained ──────────────────────────────────────────────────────────
	# None of these is a known vulnerability. The advisory says only that no further
	# patches will come, so each needs a reason it is tolerable to carry.
	#
	# Macro crates: none left. paste is gone (vendor/paste serves its API through pastey), and
	# so is proc-macro-error2: the vendored subxt macro reports errors through syn::Error,
	# aquamarine gave way to simple-mermaid, and cmd_lib 2.0.1 dropped it upstream.
	#
	# parity-wasm (RUSTSEC-2022-0061): nothing exempted. The executor's blob handling and PVF
	# stack-height metering, sp-version's embedding, wasm-builder's check, the contracts
	# fixtures and benchmarks now use wasmparser and wasm-encoder; it and wasm-instrument are
	# out of Cargo.lock.
	#
	# libsecp256k1: nothing exempted, and nothing left. It was the host-side body of the
	# secp256k1 recovery host functions; those now run on k256, checked verdict-for-verdict
	# against libsecp256k1 0.7.2 (`pezsp_core::ecdsa::recover_overflowing`). smoldot (the
	# vendored subxt light client's engine) was the second route in and is gone with that crate.
	# The last was revm-precompile's optional `libsecp256k1` feature, which nothing enabled but
	# which `std` named as a weak feature and so kept in Cargo.lock; vendor/revm-precompile is
	# the same release without it, and libsecp256k1 has left the lockfile.

	# ── memmap2 ───────────────────────────────────────────────────────────────
	# Nothing exempted. The note here said "no fixed release for the pinned versions"; 0.9.11
	# fixes 0186 and the workspace pins it now. It was tolerable while it stood -- memmap2 is
	# host-side and there is no mmap in WASM -- but tolerable stops being a reason the day a
	# patched release exists.

	# ── webpki ────────────────────────────────────────────────────────────────
	# Nothing exempted. The three rustls-webpki 0.101.7 advisories reached us through kube 0.87
	# (zombienet's Kubernetes provider); kube 4.2 is on rustls 0.23 and the patched webpki.

	# ── git2 / libgit2 ────────────────────────────────────────────────────────
	# Nothing exempted. The note said "track for upstream git2 bump" -- we are a fork and did
	# not have to wait: 0183 and 0184 are fixed in 0.21.0, which the workspace pins. One crate
	# uses it, `revive/rpc`'s build script, and only to read the branch and commit id.

	# ── hickory DNS / libp2p ──────────────────────────────────────────────────
	# Nothing exempted. RUSTSEC-2026-0119 (`hickory-proto` 0.24.4) was tolerated while the
	# rust-libp2p backend was compiled in beside litep2p and kept from running only by the
	# default backend. That backend was removed on 2026-10-11, and with it `libp2p-dns`, the
	# only path to hickory 0.24; litep2p resolves `hickory-proto` 0.26.3. The OSV-only entries on
	# the same stack (`hickory-resolver` 0.24.4, `libp2p-quic` 0.11.1, `yamux` 0.12.1,
	# `ring` 0.16.20, and `h2` 0.3.27 behind libp2p-upnp) left `.github/scripts/osv-baseline.json` in the same change.
]

# License compliance
# In v2: all licenses are denied unless explicitly allowed.
# Removed v1 fields: unlicensed, deny, copyleft, allow-osi-fsf-free, default
[licenses]
confidence-threshold = 0.8
allow = [
	"Apache-2.0 WITH LLVM-exception",
	"Apache-2.0",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"BSL-1.0",
	"CC0-1.0",
	"CDLA-Permissive-2.0",
	"GPL-3.0-only WITH Classpath-exception-2.0",
	"GPL-3.0-only",
	"GPL-3.0-or-later WITH Classpath-exception-2.0",
	"GPL-3.0-or-later",
	"ISC",
	"MIT",
	"MIT-0",
	"MPL-2.0",
	"NCSA",
	"OpenSSL",
	"Unicode-3.0",
	"Unicode-DFS-2016",
	"Unlicense",
	"Zlib",
]
exceptions = [
	# ring uses a custom ISC-style license
	{ allow = ["OpenSSL"], name = "ring" },
]

[licenses.private]
ignore = true

# Banned crates and duplicate version detection
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "simplest-path"
deny = []
skip = []
skip-tree = []

# Source origin checks
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
	# Our serde fork with wasm32v1-none target fix (pending upstream merge)
	"https://github.com/pezkuwichain/serde.git",
]
