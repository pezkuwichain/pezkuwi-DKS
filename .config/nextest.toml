# This is the default config used by nextest. It is embedded in the binary at
# build time. It may be used as a template for .config/nextest.toml.

[store]
# The directory under the workspace root at which nextest-related files are
# written. Profile-specific storage is currently written to dir/<profile-name>.
dir = "target/nextest"

# This section defines the default nextest profile. Custom profiles are layered
# on top of the default profile.
[profile.default]
# "retries" defines the number of times a test should be retried. If set to a
# non-zero value, tests that succeed on a subsequent attempt will be marked as
# non-flaky. Can be overridden through the `--retries` option.
# Examples
# * retries = 3
# * retries = { backoff = "fixed", count = 2, delay = "1s" }
# * retries = { backoff = "exponential", count = 10, delay = "1s", jitter = true, max-delay = "10s" }
retries = 5

# The number of threads to run tests with. Supported values are either an integer or
# the string "num-cpus". Can be overridden through the `--test-threads` option.
# test-threads = "num-cpus"
test-threads = "num-cpus"

# The number of threads required for each test. This is generally used in overrides to
# mark certain tests as heavier than others. However, it can also be set as a global parameter.
threads-required = 1

# Show these test statuses in the output.
#
# The possible values this can take are:
# * none: no output
# * fail: show failed (including exec-failed) tests
# * retry: show flaky and retried tests
# * slow: show slow tests
# * pass: show passed tests
# * skip: show skipped tests (most useful for CI)
# * all: all of the above
#
# Each value includes all the values above it; for example, "slow" includes
# failed and retried tests.
#
# Can be overridden through the `--status-level` flag.
status-level = "pass"

# Similar to status-level, show these test statuses at the end of the run.
final-status-level = "flaky"

# "failure-output" defines when standard output and standard error for failing tests are produced.
# Accepted values are
# * "immediate": output failures as soon as they happen
# * "final": output failures at the end of the test run
# * "immediate-final": output failures as soon as they happen and at the end of
#   the test run; combination of "immediate" and "final"
# * "never": don't output failures at all
#
# For large test suites and CI it is generally useful to use "immediate-final".
#
# Can be overridden through the `--failure-output` option.
failure-output = "immediate"

# "success-output" controls production of standard output and standard error on success. This should
# generally be set to "never".
success-output = "never"

# Cancel the test run on the first failure. For CI runs, consider setting this
# to false.
fail-fast = true

# Treat a test that takes longer than the configured 'period' as slow, and print a message.
# See <https://nexte.st/book/slow-tests> for more information.
#
# Optional: specify the parameter 'terminate-after' with a non-zero integer,
# which will cause slow tests to be terminated after the specified number of
# periods have passed.
# Example: slow-timeout = { period = "60s", terminate-after = 2 }
# A slow test is worth a line in the log; a hung test is worth killing.
#
# Without `terminate-after` nextest prints SLOW forever and waits, so a hung test costs the
# whole job timeout -- twelve hours of a runner -- and reports nothing at all, which is worse
# than a red because a red at least says something. Re-measured on the 2026-09-06 green run
# (34014730362, 16,947 results across all four test jobs): p99 is 35s, 110 exceed 60s, 56
# exceed 300s, 20 exceed 1200s, and four exceed 1800s -- all four `pezkuwi-sdk-docs`, which
# has its own budget below.
#
# Thirty periods of sixty seconds kills a hang in half an hour. What that number cannot do is
# tell a hang apart from a test that honestly takes that long, so anything running close to it
# on a *green* run is one contended runner away from being killed and reported as a failure
# with nothing to read. Two families were in that position and now have budgets of their own:
# `export_import_revert` at 1696s was using 94% of this, and the nine `pezkuwi-node-core-pvf`
# integration tests 78-90%. Raising the global instead would have bought them room by giving
# every genuine hang another half hour, which is the wrong trade for 16,000 tests whose p99 is
# 35 seconds.
slow-timeout = { period = "60s", terminate-after = 30 }

# Treat a test as leaky if after the process is shut down, standard output and standard error
# aren't closed within this duration.
#
# This usually happens in case of a test that creates a child process and lets it inherit those
# handles, but doesn't clean the child process up (especially when it fails).
#
# See <https://nexte.st/book/leaky-tests> for more information.
leak-timeout = "100ms"

[profile.default.junit]
# Output a JUnit report into the given file inside 'store.dir/<profile-name>'.
# If unspecified, JUnit is not written out.

path = "junit.xml"

# The name of the top-level "report" element in JUnit report. If aggregating
# reports across different test runs, it may be useful to provide separate names
# for each report.
report-name = "bizinikiwi"

# Whether standard output and standard error for passing tests should be stored in the JUnit report.
# Output is stored in the <system-out> and <system-err> elements of the <testcase> element.
store-success-output = false

# Whether standard output and standard error for failing tests should be stored in the JUnit report.
# Output is stored in the <system-out> and <system-err> elements of the <testcase> element.
#
# Note that if a description can be extracted from the output, it is always stored in the
# <description> element.
store-failure-output = true

# This profile is activated if MIRI_SYSROOT is set.
[profile.default-miri]
# Miri tests take up a lot of memory, so only run 1 test at a time by default.
test-threads = 1

# Mutual exclusion of tests with `cargo build` invocation as a lock to avoid multiple
# simultaneous invocations clobbering each other.
[test-groups]
serial-integration = { max-threads = 1 }

# Running UI tests sequentially
# More info can be found here: https://github.com/paritytech/ci_cd/issues/754
[[profile.default.overrides]]
filter = 'test(/(^ui$|_ui|ui_)/)'
test-group = 'serial-integration'

# The snowbridge ethereum-client tests load large beacon-chain fixtures and run BLS over a
# 512-key sync committee. They pass in isolation but aborted under full-suite concurrency on
# the capped self-hosted runners (memory pressure). Reserve all threads so each runs alone,
# without concurrent contention.
[[profile.default.overrides]]
filter = 'package(pezsnowbridge-pezpallet-ethereum-client)'
threads-required = 'num-cpus'

# benchmark_extrinsic_works spins up a full dev node (BABE + block-import workers) for every
# runtime/extrinsic pair to smoke-test the `benchmark extrinsic` command. Under full-suite
# concurrency on the capped self-hosted runners its node's essential consensus tasks get
# starved and the service shuts down ("Essential task failed"). Give it the whole runner so
# the node has the resources to run — it is a heavy end-to-end node test, not a unit test.
[[profile.default.overrides]]
filter = 'test(benchmark_extrinsic_works)'
threads-required = 'num-cpus'
slow-timeout = { period = "120s", terminate-after = 10 }

# The two longest tests in the suite are here, at 3849s and 3720s, and almost none of that is
# testing: `your_first_node` shells out to `cargo build --release` for a runtime and a node
# before it can run them. Until that build moves out of the test, the budget has to cover it.
[[profile.default.overrides]]
filter = 'package(pezkuwi-sdk-docs)'
slow-timeout = { period = "300s", terminate-after = 20 }

# Sixty end-to-end sub-tests against a node and an RPC server this test starts itself. It used
# to carry its own 300s deadline; on a runner also building a release binary it blew that on
# five attempts and passed the sixth in 224s, which tripped the retry-exhaustion gate and
# failed the job. The budget was not the defect — sharing the machine was. Give it the runner,
# and let the harness bound the hang: 120s x 10 is twenty minutes, ample for a 224s test that
# is not competing for cores.
[[profile.default.overrides]]
filter = 'test(run_all_eth_rpc_tests)'
threads-required = 'num-cpus'
slow-timeout = { period = "120s", terminate-after = 10 }

# `export_import_revert` builds a chain, exports it, re-imports it and reverts it, all through
# the node binary. Measured at 1696s on a green run -- 94% of the global budget, which exists
# to kill hangs and would kill this instead the first time the runner is busy. An hour is
# still a hang by any reading.
[[profile.default.overrides]]
filter = 'binary_id(pezstaging-node-cli::export_import_flow)'
slow-timeout = { period = "120s", terminate-after = 30 }

# The PVF integration tests each prepare and execute real PVF artifacts in spawned worker
# processes, and there are nine of them between 1397s and 1626s -- 78-90% of the global
# budget. Same reasoning as above: they are slow because of what they do, not because they
# are stuck.
[[profile.default.overrides]]
filter = 'binary_id(pezkuwi-node-core-pvf::it)'
slow-timeout = { period = "120s", terminate-after = 30 }

# `full_native_block_import_works` and its siblings import blocks through the real node at
# 1235s and below. Further from the line than the two above, but the same shape, and the
# whole binary is given the budget so a slower sibling does not have to be discovered by
# being killed.
[[profile.default.overrides]]
filter = 'binary_id(pezstaging-node-cli::basic)'
slow-timeout = { period = "120s", terminate-after = 20 }
