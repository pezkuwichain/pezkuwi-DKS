[package]
name = "pezkuwi-jemalloc-shim"
version = "0.6.0"
description = "Shim crate to enable jemalloc-allocator feature for polkadot crates and setting global allocator to jemalloc"
license.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[package.metadata.pezkuwi-sdk]
exclude-from-umbrella = true

[dependencies]
pezkuwi-cli = { optional = true, workspace = true }
pezkuwi-node-core-pvf = { optional = true, workspace = true }
pezkuwi-node-core-pvf-prepare-worker = { optional = true, workspace = true }
pezkuwi-overseer = { optional = true, workspace = true }
tikv-jemallocator = { optional = true, features = ["unprefixed_malloc_on_supported_platforms"], workspace = true }

[features]
jemalloc-allocator = [
	"dep:tikv-jemallocator",
	"pezkuwi-cli/jemalloc-allocator",
	"pezkuwi-node-core-pvf-prepare-worker/jemalloc-allocator",
	"pezkuwi-node-core-pvf/jemalloc-allocator",
	"pezkuwi-overseer/jemalloc-allocator",
]
