[package]
name = "pezsp-virtualization"
version = "0.4.0"
license = "Apache-2.0"
authors.workspace = true
edition.workspace = true
repository.workspace = true
description = "Spawn a new polkavm instance from within the runtime/pvf"

[lints]
workspace = true

[dependencies]
codec = { workspace = true, default-features = false, features = ["bytes"] }
log = { workspace = true }
num_enum = { workspace = true, default-features = false }
pezsp-runtime-interface = { workspace = true, default-features = false }
strum = { features = ["derive"], workspace = true }

[target.'cfg(not(bizinikiwi_runtime))'.dependencies]
pezsp-externalities = { workspace = true, default-features = true }
pezsp-storage = { workspace = true, default-features = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"log/std",
	"num_enum/std",
	"pezsp-runtime-interface/std",
	"strum/std",
]
