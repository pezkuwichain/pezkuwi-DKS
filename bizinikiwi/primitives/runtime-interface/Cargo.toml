[package]
name = "pezsp-runtime-interface"
version = "24.0.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Bizinikiwi runtime interface"
documentation.workspace = true
readme = "README.md"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
bytes = { workspace = true }
codec = { features = ["bytes"], workspace = true }
impl-trait-for-tuples = { workspace = true }
pezsp-externalities = { workspace = true }
pezsp-runtime-interface-proc-macro = { workspace = true, default-features = true }
pezsp-std = { workspace = true }
pezsp-storage = { workspace = true }
pezsp-tracing = { workspace = true }
pezsp-wasm-interface = { workspace = true }
static_assertions = { workspace = true, default-features = true }

[target.'cfg(all(any(target_arch = "riscv32", target_arch = "riscv64"), bizinikiwi_runtime))'.dependencies]
polkavm-derive = { workspace = true }

[dev-dependencies]
pezsp-io = { workspace = true, default-features = true }
pezsp-runtime-interface-test-wasm = { workspace = true }
pezsp-state-machine = { workspace = true, default-features = true }
rustversion = { workspace = true }
trybuild = { workspace = true }

[features]
default = ["std"]
std = [
	"bytes/std",
	"codec/std",
	"pezsp-externalities/std",
	"pezsp-io/std",
	"pezsp-runtime-interface-test-wasm/std",
	"pezsp-state-machine/std",
	"pezsp-std/std",
	"pezsp-storage/std",
	"pezsp-tracing/std",
	"pezsp-wasm-interface/std",
]
disable_target_static_assertions = []
runtime-benchmarks = [
	"pezsp-io/runtime-benchmarks",
	"pezsp-runtime-interface-test-wasm/runtime-benchmarks",
	"pezsp-state-machine/runtime-benchmarks",
]
serde = []
with-tracing = []

[target.'cfg(all(target_arch = "riscv64", substrate_runtime))'.dependencies]
polkavm-derive = { workspace = true }
