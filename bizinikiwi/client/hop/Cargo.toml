[package]
name = "pezsc-hop"
version = "0.2.0"
authors.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
repository.workspace = true
description = "Hand-Off Protocol (HOP) ephemeral data pool service"

[lints]
workspace = true

[dependencies]
# Core
codec = { workspace = true, features = ["derive"] }
hex = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }

# Async
futures-timer = { workspace = true }

# CLI
clap = { workspace = true, features = ["derive"] }

# RPC
jsonrpsee = { workspace = true, features = ["client", "macros", "server"] }

# Substrate primitives (client-side, always with std)
pezkuwi-primitives = { workspace = true, default-features = true }
pezsc-transaction-pool-api = { workspace = true, default-features = true }
pezsp-api = { workspace = true, default-features = true }
pezsp-blockchain = { workspace = true, default-features = true }
pezsp-core = { workspace = true, default-features = true }
pezsp-crypto-hashing = { workspace = true, default-features = true }
pezsp-hop = { workspace = true, default-features = true }
pezsp-runtime = { workspace = true, default-features = true }

[dev-dependencies]
pezsp-externalities = { workspace = true, default-features = true }
pezsp-state-machine = { workspace = true, default-features = true }
pezsp-test-primitives = { workspace = true }
pezsp-version = { workspace = true, default-features = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
