version: 2
updates:
  # GitHub Actions — grouped weekly, but majors kept apart from the routine churn.
  # A single "*" group put a breaking major in the same PR as a pile of patches, where it
  # reads as routine and gets merged as routine. Splitting by update type is what makes the
  # major visible; it is the same split the root workspace already uses below.
  - package-ecosystem: github-actions
    directory: '/'
    labels: ["A1-insubstantial", "R0-no-crate-publish-required"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      ci-minor-patch:
        update-types: ["minor", "patch"]
      ci-major:
        update-types: ["major"]

  # Rust workspace (root). Collapse the routine churn into TWO grouped PRs a week
  # (minor/patch together, major together) instead of one PR per crate — otherwise
  # every unrelated bump opens its own branch and floods the repo (the reason we had
  # to batch-close a pile of them). Majors stay in their own group so they still get
  # a deliberate review before merge.
  - package-ecosystem: "cargo"
    directory: "/"
    labels: ["A1-insubstantial", "R0-no-crate-publish-required"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
      cargo-major:
        update-types: ["major"]
