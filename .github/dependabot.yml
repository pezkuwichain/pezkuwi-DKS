version: 2
updates:
  # GitHub Actions — grouped weekly, but majors kept apart from the routine churn.
  # A single "*" group put a breaking major in the same PR as a pile of patches, where it
  # reads as routine and gets merged as routine. Splitting by update type is what makes the
  # major visible; it is the same split the root workspace already uses below.
  - package-ecosystem: github-actions
    directory: '/'
    labels: ["A1-insubstantial", "R0-no-crate-publish-required"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      ci-minor-patch:
        update-types: ["minor", "patch"]
      ci-major:
        update-types: ["major"]

  # Rust workspace (root). Collapse the routine churn into TWO grouped PRs a week
  # (minor/patch together, major together) instead of one PR per crate — otherwise
  # every unrelated bump opens its own branch and floods the repo (the reason we had
  # to batch-close a pile of them). Majors stay in their own group so they still get
  # a deliberate review before merge.
  - package-ecosystem: "cargo"
    directory: "/"
    labels: ["A1-insubstantial", "R0-no-crate-publish-required"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
      cargo-major:
        update-types: ["major"]
    # The one advisory that cannot be answered by a bump, and so fails on every attempt.
    #
    # `libp2p-quic` is patched in 0.13.1; `libp2p 0.54.1` pins `^0.11`, so the fix arrives only
    # by upgrading libp2p itself -- measured and rejected on 2026-09-09 as decision C, because
    # the vulnerable path is not one this tree runs. The default network backend is litep2p and
    # no validator in the fleet passes `--network-backend`; `pezsc-network` does not even enable
    # the `quic` feature, so the crate sits in the lockfile and never in the build.
    #
    # Left unignored, dependabot opens a security job weekly, finds no reachable version, and
    # leaves a red run that reads like a new problem -- and somebody spends an hour
    # rediscovering a closed decision. That is the treadmill, not diligence.
    #
    # The exemption ends where `deny.toml`'s does: with the sync that brings a newer libp2p. It
    # is bounded to the affected range, so a different advisory on the same crate still speaks.
    ignore:
      - dependency-name: "libp2p-quic"
        versions: ["< 0.13.1"]

  # usdt-bridge is a separate crate/workspace with its own Cargo.lock; group its bumps
  # so the bridge never spawns per-crate PRs of its own (e.g. the stray rand/rustls ones).
  # Majors are separated for the same reason as above: this workspace signs and submits
  # transactions, so a breaking bump riding along in a patch PR is the worst place for one.
  - package-ecosystem: "cargo"
    directory: "/tools/usdt-bridge"
    labels: ["A1-insubstantial"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      bridge-minor-patch:
        update-types: ["minor", "patch"]
      bridge-major:
        update-types: ["major"]
