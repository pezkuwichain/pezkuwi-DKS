name: release

# Builds the deployable runtime WASM blobs, publishes their authorize_upgrade
# hashes, and signs the artifacts. A runtime upgrade on a fund-holding chain must be
# verifiable: anyone can rebuild from this tag with the pinned toolchain (1.96.0,
# rust-toolchain.toml) + the committed Cargo.lock and compare the blake2-256 hash to
# what governance authorizes.
#
# Hermetic without srtool (which has no Rust 1.96 image): the pinned toolchain, the
# committed lockfile, a fixed build path per runtime and remapped cargo/rustup homes.
# Rebuild at `/tmp/pezkuwi-build/<runtime>/pezkuwi-DKS` with the same flags and the hash
# matches, on any box and as any user.

on:
  push:
    tags:
      - "v*"
      - "runtime-*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (defaults to the triggering ref)"
        required: false

permissions:
  contents: write # create the GitHub release
  id-token: write # build-provenance attestation
  attestations: write # build-provenance attestation

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # A runtime WASM must never be built from a commit whose full test suite has not
  # passed. The fast PR gate is deliberately narrow (see 84cd571b) — it is the heavy
  # suite in test.yml that actually exercises the code, and it runs nightly rather
  # than per-PR. So before producing a deployable blob, require a *successful test.yml
  # run for this exact commit*. If there is none, trigger it and stop: the operator
  # re-runs the release once it is green.
  full-ci-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require a green full test suite for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          SHA=$(gh api "repos/${{ github.repository }}/commits/$SHA" --jq .sha)
          echo "commit under release: $SHA"
          CONCLUSION=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/test.yml/runs?head_sha=$SHA&status=completed" \
            --jq '[.workflow_runs[] | select(.conclusion=="success")] | length')
          if [ "$CONCLUSION" -gt 0 ]; then
            echo "full test suite is green for this commit"
            exit 0
          fi
          echo "::error::No successful test.yml run for $SHA."
          echo "Dispatching the full suite now; re-run this release once it is green."
          gh workflow run test.yml --ref "$SHA" || true
          exit 1

  build-runtime:
    needs: full-ci-gate
    # Any runner in the pool: the build is hermetic (fixed path + remapped homes below), so
    # the published hash does not depend on which box picked the job up.
    runs-on: [self-hosted, bizinikiwi-build]
    strategy:
      fail-fast: false
      matrix:
        # Mainnet relay + system teyrchains. The deployable on-chain artifacts.
        runtime:
          - pezkuwichain-runtime
          - asset-hub-pezkuwichain-runtime
          - people-pezkuwichain-runtime
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Move to the fixed build path
        # The build path is part of the wasm: cargo folds a path dependency's absolute
        # location into the crate's metadata hash, and that hash is in every mangled symbol.
        # So the path is fixed -- per runtime, so two matrix jobs on one box cannot share a
        # tree -- and the same on every runner. Measured 2026-09-24: two boxes, two users,
        # one path, one hash; two paths on one box, two hashes.
        run: |
          set -euo pipefail
          b="/tmp/pezkuwi-build/${{ matrix.runtime }}/pezkuwi-DKS"
          rm -rf "$b" && mkdir -p "$b"
          cp -a "$GITHUB_WORKSPACE/." "$b/"
          echo "BUILD_DIR=$b" >> "$GITHUB_ENV"

      - name: Toolchain & targets
        run: |
          rustup show
          rustup component add rust-src
          rustup target add wasm32v1-none wasm32-unknown-unknown

      - name: Build deployable runtime WASM (release, locked)
        # The cargo and rustup homes differ between runners and do reach the wasm as path
        # strings; remapped, they leave nothing of the host in the blob.
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          export WASM_BUILD_RUSTFLAGS="--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo --remap-path-prefix=${RUSTUP_HOME:-$HOME/.rustup}=/rustup"
          cargo build --release --locked -p ${{ matrix.runtime }}

      - name: Locate WASM and compute upgrade hashes
        id: wasm
        run: |
          set -euo pipefail
          # The compact+compressed blob is the artifact that goes on-chain.
          # Some runtimes (the relay's build.rs, in particular) also emit a
          # `fast-runtime`-feature devnet variant (fast_runtime_binary.rs.*) in
          # the same wbuild dir for local/zombienet testing — never pick that
          # one up here. Fail loudly on anything else ambiguous rather than
          # silently taking whichever file a bare `find | head -1` returns
          # first (directory order is not guaranteed).
          wbuild_dir="$BUILD_DIR/target/release/wbuild/${{ matrix.runtime }}"
          mapfile -t candidates < <(find "$wbuild_dir" -maxdepth 1 \
                 -name '*.compact.compressed.wasm' ! -name 'fast_runtime_binary*')
          if [ "${#candidates[@]}" -eq 0 ]; then
            echo "::error::no compressed WASM found for ${{ matrix.runtime }}"; exit 1
          fi
          if [ "${#candidates[@]}" -gt 1 ]; then
            echo "::error::ambiguous compressed WASM candidates for ${{ matrix.runtime }}: ${candidates[*]}"; exit 1
          fi
          wasm="${candidates[0]}"
          out="artifacts"; mkdir -p "$out"
          base="${{ matrix.runtime }}"
          cp "$wasm" "$out/${base}.compact.compressed.wasm"
          # blake2-256 is the hash governance authorizes (authorize_upgrade / proposal hash).
          b2=$(b2sum -l 256 "$wasm" | cut -d' ' -f1)
          sha=$(sha256sum "$wasm" | cut -d' ' -f1)
          size=$(stat -c%s "$wasm")
          {
            echo "### ${base}"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| commit | \`${GITHUB_SHA}\` |"
            echo "| toolchain | \`$(rustc --version)\` |"
            echo "| size (bytes) | ${size} |"
            echo "| blake2-256 (authorize_upgrade) | \`0x${b2}\` |"
            echo "| sha256 | \`${sha}\` |"
            echo ""
          } > "$out/${base}.digest.md"
          echo "wasm=$out/${base}.compact.compressed.wasm" >> "$GITHUB_OUTPUT"
          echo "blake2_256=0x${b2}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.wasm.outputs.wasm }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.runtime }}
          path: artifacts/*
          if-no-files-found: error

      - name: Remove the build tree
        # Gigabytes of target per runtime, in a path no later job reuses.
        if: always()
        run: rm -rf "/tmp/pezkuwi-build/${{ matrix.runtime }}"

  publish:
    needs: build-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dl
      - name: Assemble release notes
        run: |
          set -e
          mkdir -p release
          find dl -name '*.compact.compressed.wasm' -exec cp {} release/ \;
          echo "# PezkuwiChain runtimes — ${GITHUB_REF_NAME}" > NOTES.md
          echo "" >> NOTES.md
          echo "Verify: rebuild this tag with the pinned toolchain (rust-toolchain.toml)" >> NOTES.md
          echo "and committed Cargo.lock, then compare the blake2-256 below to the hash" >> NOTES.md
          echo "authorized on-chain (\`system.authorizeUpgrade\`)." >> NOTES.md
          echo "" >> NOTES.md
          cat $(find dl -name '*.digest.md' | sort) >> NOTES.md
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: NOTES.md
          files: release/*
          draft: true # human review before publishing a fund-critical artifact
          fail_on_unmatched_files: true
