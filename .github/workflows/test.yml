name: test

# Heavy correctness jobs that compile the whole workspace (full test suite, clippy,
# benches, doc-tests). To keep the push/PR feedback loop fast, these do NOT run on
# every push — the every-push gate (compile + runtime build + try-runtime + security
# + quick-checks) lives in check.yml / quick-checks.yml / security.yml. This heavy
# suite runs nightly and on demand (e.g. before a release). They run on the dedicated
# self-hosted build runners and — for security on this public repo — never on
# pull requests from forks.

on:
  schedule:
    - cron: "0 2 * * *" # nightly 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed on the pull request for PRs and on the commit everywhere else, never on the ref.
  # A release cannot proceed until this suite has completed successfully for its exact
  # commit (see full-ci-gate in release-testnet.yml), and a ref-keyed group let the next
  # push to the same branch cancel the run the release was waiting on -- leaving the gate
  # with no successful run to find and no failure to explain it. Superseding still happens
  # where it is wanted: a new push to a PR cancels that PR's earlier run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The full-workspace test/clippy/bench compile produced a target dir large enough to
  # overflow the smaller self-hosted runners ("No space left on device"). Debug info is the
  # bulk of compiled test binaries and is not needed to run tests, so drop it — this shrinks
  # the target dir dramatically and keeps the heavy jobs within disk on every runner.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # The snowbridge ethereum-client tests are stack-heavy (SSZ merkleization + BLS over a
  # 512-key sync committee). They pass in isolation but aborted under the full-suite
  # concurrency on the runners; give every test thread a generous stack (upstream Substrate
  # does the same for its CI).
  RUST_MIN_STACK: "33554432"
  # NOTE: CARGO_BUILD_JOBS is intentionally NOT set here. Build parallelism is configured
  # per-runner via each runner's systemd Environment, so the big VPS3 runners (94GB/18-core)
  # build with high parallelism while the small 11GB runners stay RAM-safe at a lower count.

jobs:
  # Unit/integration tests, split into partitions that spread across the runner pool.
  test:
    runs-on: [self-hosted, bizinikiwi-build]
    # sccache is intentionally NOT used (its server crashing mid-build failed jobs across
    # retries); builds compile cold, so allow generous wall-clock instead of the 6h default.
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-solidity
      - name: Free disk if low
        # Heaviest job — compiles the whole workspace's test binaries. The persistent
        # target dir accumulates and can fill smaller runners; clean it when low.
        run: |
          avail=$(df -BG --output=avail "$PWD" | tail -1 | tr -dc 0-9)
          echo "free: ${avail}G"
          if [ "${avail:-999}" -lt 80 ]; then echo "cleaning target"; rm -rf target; fi
          # Backstop on small-disk runners: if still critically low, drop the sccache cache too
          # so a build can never fill the host disk (these runners share VPSs with validators,
          # the bridge and web services — a full disk would take those down).
          avail=$(df -BG --output=avail "$PWD" | tail -1 | tr -dc 0-9)
          if [ "${avail:-999}" -lt 40 ]; then
            echo "critically low (${avail}G): clearing sccache"
            rm -rf "${SCCACHE_DIR:-$HOME/.cache/sccache}"/* 2>/dev/null || true
          fi
      - name: Run tests (nextest, partition ${{ matrix.partition }}/2)
        run: |
          # One exclusion, and it is an environment one: the zombienet SDK tests ask a
          # provider to create a Kubernetes namespace and a volume, and there is no cluster
          # behind these runners, so they fail before reaching any of our code
          # (ProviderError(CreateNamespaceFailed) on main, 2026-08-20). Nothing in the
          # workspace can fix that; only giving the runners a cluster, or teaching the tests
          # to skip when no provider answers, will. Tracked in issue #11 — the right fix is
          # one of those two, not this line.
          #
          # Everything else that used to be listed here has been removed. The entries were
          # accurate when written and had quietly outlived their reasons: chain-spec-guide,
          # sdk-docs, omni-bencher, txtesttool, contracts, revive-eth-rpc, revive-fixtures
          # and an asset-hub erc20 case. Two of them show what the drift costs — the
          # zombienet-configuration `network_config_builder` case passes on main, so it was
          # being excluded for nothing, and contracts and revive were held out as
          # "testnet-only" although mainnet is to be a mirror of a validated Zagros, which
          # makes today's testnet tomorrow's mainnet.
          #
          # If any of these are still red, that is work this sync exists to surface, and a
          # red run states it. An exclusion states nothing, and nobody returns to it: the 46
          # mainnet integration tests were excluded on 2026-06-23 because the emulated tree
          # did not compile, it was repaired on 2026-08-18 and passes 238/238, and the
          # exclusion was still in place a month after its reason expired.
          FILTER='not (package(pezkuwi-zombienet-sdk))'
          cargo nextest run --workspace --locked --no-fail-fast \
            -E "$FILTER" \
            --partition count:${{ matrix.partition }}/2 \
            --config-file .config/nextest.toml

  # Doctests (nextest does not run these).
  doc-test:
    runs-on: [self-hosted, bizinikiwi-build]
    # sccache is intentionally NOT used (its server crashing mid-build failed jobs across
    # retries); builds compile cold, so allow generous wall-clock instead of the 6h default.
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-solidity
      - name: Free disk if low
        # The persistent target dir accumulates artifacts across heavy builds and can
        # fill smaller runners. Clean it when free space is low; sccache keeps the
        # rebuild warm. Prevents the "No space left on device" failures.
        run: |
          avail=$(df -BG --output=avail "$PWD" | tail -1 | tr -dc 0-9)
          echo "free: ${avail}G"
          if [ "${avail:-999}" -lt 80 ]; then echo "cleaning target"; rm -rf target; fi
          # Backstop on small-disk runners: if still critically low, drop the sccache cache too
          # so a build can never fill the host disk (these runners share VPSs with validators,
          # the bridge and web services — a full disk would take those down).
          avail=$(df -BG --output=avail "$PWD" | tail -1 | tr -dc 0-9)
          if [ "${avail:-999}" -lt 40 ]; then
            echo "critically low (${avail}G): clearing sccache"
            rm -rf "${SCCACHE_DIR:-$HOME/.cache/sccache}"/* 2>/dev/null || true
          fi
      # Retry only transient infra failures (crate fetch, sccache first-use, runner glitch on a
      # capped/shared VPS). A real failure still returns non-zero on every attempt and fails.
      - name: Doc tests
        run: |
          n=0
          until cargo test --doc --workspace --locked; do
            n=$((n+1)); [ "$n" -ge 3 ] && { echo "doc tests failed after $n attempts"; exit 1; }
            echo "doc-test attempt $n failed — retrying (transient infra)"; sleep 15
          done

  # Lint. The lint policy lives in the root Cargo.toml [workspace.lints.clippy]:
  # `correctness` is denied (a hard, fund-critical gate — real-bug lints fail CI),
  # while `complexity` stays at the upstream-curated `warn` (style/advisory). We do
  # NOT add a blanket `-D warnings`, which would override that curated policy and
  # turn every newer-toolchain style lint into a failure.
  clippy:
    runs-on: [self-hosted, bizinikiwi-build]
    # sccache is intentionally NOT used (its server crashing mid-build failed jobs across
    # retries); builds compile cold, so allow generous wall-clock instead of the 6h default.
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-solidity
      - name: Free disk if low
        # The persistent target dir accumulates artifacts across heavy builds and can
        # fill smaller runners. Clean it when free space is low; sccache keeps the
        # rebuild warm. Prevents the "No space left on device" failures.
        run: |
          avail=$(df -BG --output=avail "$PWD" | tail -1 | tr -dc 0-9)
          echo "free: ${avail}G"
          if [ "${avail:-999}" -lt 80 ]; then echo "cleaning target"; rm -rf target; fi
          # Backstop on small-disk runners: if still critically low, drop the sccache cache too
          # so a build can never fill the host disk (these runners share VPSs with validators,
          # the bridge and web services — a full disk would take those down).
          avail=$(df -BG --output=avail "$PWD" | tail -1 | tr -dc 0-9)
          if [ "${avail:-999}" -lt 40 ]; then
            echo "critically low (${avail}G): clearing sccache"
            rm -rf "${SCCACHE_DIR:-$HOME/.cache/sccache}"/* 2>/dev/null || true
          fi
      # Retry only transient infra failures (crate fetch, sccache first-use, runner glitch on a
      # capped/shared VPS). A real lint still returns non-zero on every attempt and fails.
      - name: Clippy
        run: |
          n=0
          until cargo clippy --workspace --locked --no-deps; do
            n=$((n+1)); [ "$n" -ge 3 ] && { echo "clippy failed after $n attempts"; exit 1; }
            echo "clippy attempt $n failed — retrying (transient infra)"; sleep 15
          done

  # Benchmarks must compile (weights are fund-critical: wrong weights enable DoS /
  # fee miscalculation). We check compilation here; actual weight generation is a
  # separate release-time step.
  check-benches:
    runs-on: [self-hosted, bizinikiwi-build]
    # sccache is intentionally NOT used (its server crashing mid-build failed jobs across
    # retries); builds compile cold, so allow generous wall-clock instead of the 6h default.
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-solidity
      - name: Free disk if low
        # The persistent target dir accumulates artifacts across heavy builds and can
        # fill smaller runners. Clean it when free space is low; sccache keeps the
        # rebuild warm. Prevents the "No space left on device" failures.
        run: |
          avail=$(df -BG --output=avail "$PWD" | tail -1 | tr -dc 0-9)
          echo "free: ${avail}G"
          if [ "${avail:-999}" -lt 80 ]; then echo "cleaning target"; rm -rf target; fi
          # Backstop on small-disk runners: if still critically low, drop the sccache cache too
          # so a build can never fill the host disk (these runners share VPSs with validators,
          # the bridge and web services — a full disk would take those down).
          avail=$(df -BG --output=avail "$PWD" | tail -1 | tr -dc 0-9)
          if [ "${avail:-999}" -lt 40 ]; then
            echo "critically low (${avail}G): clearing sccache"
            rm -rf "${SCCACHE_DIR:-$HOME/.cache/sccache}"/* 2>/dev/null || true
          fi
      # Retry only transient infra failures (crate fetch, sccache first-use, runner glitch on a
      # capped/shared VPS). A real failure still returns non-zero on every attempt and fails.
      - name: Check benches
        run: |
          n=0
          until cargo check --workspace --locked --benches --features runtime-benchmarks; do
            n=$((n+1)); [ "$n" -ge 3 ] && { echo "check-benches failed after $n attempts"; exit 1; }
            echo "check-benches attempt $n failed — retrying (transient infra)"; sleep 15
          done

  # ── Coverage that existed only in .gitlab-ci.yml ────────────────────────────
  # These ran nowhere: the GitLab pipeline is gated off behind RUN_GITLAB_CI and
  # its own comment assumed "the authoritative full CI runs on GitHub". They are
  # part of the suite that must be green before anything is deployed to a chain.

  workspace-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.x' }
      - name: Install tooling
        run: pip3 install -r .github/scripts/requirements.txt --quiet
      - name: Check workspace membership and manifests
        # Catches a crate that is in the tree but absent from the workspace, which is
        # how pezpallet-staking-async-teyrchain-runtime stayed broken on main unnoticed.
        run: |
          # vendor/arrayvec and vendor/core2 are [patch.crates-io] replacements, not
          # workspace members: both upstreams fail to build for wasm32v1-none and are
          # vendored in-tree so the build stays self-contained. See the comments on the
          # patch entries in the root Cargo.toml.
          python3 .github/scripts/check-workspace.py . \
            --exclude "bizinikiwi/pezframe/contracts/fixtures/build" \
                      "bizinikiwi/pezframe/contracts/fixtures/contracts/common" \
                      "vendor/arrayvec" "vendor/core2"
      - name: Deny git dependencies
        run: python3 .github/scripts/deny-git-deps.py .

  rust-features:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Check feature combinations
        run: bash .gitlab/rust-features.sh .

  licenses-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Every source file carries a licence header
        run: |
          FAIL=0
          for dir in pezkuwi pezcumulus bizinikiwi; do
            echo "Checking license headers in ./$dir..."
            MISSING=""
            while IFS= read -r f; do
              head -20 "$f" | grep -qiE "(apache|gpl|mit|unlicense|copyright)" || MISSING="$MISSING\n$f"
            done < <(find "./$dir" -name "*.rs" -not -path "*/target/*")
            if [ -n "$MISSING" ]; then
              echo "Missing licence header:"; printf "%b\n" "$MISSING"; FAIL=1
            fi
          done
          exit $FAIL

  umbrella:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.x' }
      - name: Install tooling
        run: |
          pip3 install -r .github/scripts/requirements.txt --quiet
          cargo install zepter@1.82.1 --force --quiet
          # generate-umbrella.py formats the manifest it writes with taplo; without it the
          # generated file differs from the committed one on formatting alone.
          cargo install taplo-cli --locked --quiet
          # The umbrella check re-formats after generating, and that runs on nightly.
          rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Umbrella crate is consistent with the workspace
        run: |
          git config --global --add safe.directory '*'
          UMBRELLA_VERSION=$(cargo metadata --format-version=1 --locked | \
            python3 -c "import json,sys; pkgs=json.load(sys.stdin)['packages']; \
              print(next(p['version'] for p in pkgs if p['manifest_path'].endswith('umbrella/Cargo.toml')))")
          echo "umbrella version: $UMBRELLA_VERSION"
          python3 scripts/generate-umbrella.py --sdk . --version "$UMBRELLA_VERSION"
          # The generator writes the crate list; the feature lists are filled in by zepter.
          # Without this step every regeneration wipes them and the diff is enormous.
          zepter run default
          cargo +nightly fmt -p pezkuwi-sdk
          git diff --exit-code || {
            echo "The umbrella crate is out of sync. Reproduce with:"
            echo "  python3 scripts/generate-umbrella.py --sdk . --version $UMBRELLA_VERSION"
            echo "  zepter run default && cargo +nightly fmt -p pezkuwi-sdk"
            exit 1
          }

  core-crypto-features:
    runs-on: [self-hosted, bizinikiwi-build]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-solidity
      - name: Feature variants of the core crypto primitives
        run: |
          rustup target add wasm32v1-none
          for pkg in core application-crypto keyring; do
            echo "--- bizinikiwi/primitives/$pkg ---"
            (cd "bizinikiwi/primitives/$pkg" && ./check-features-variants.sh)
          done

  wasm-check:
    runs-on: [self-hosted, bizinikiwi-build]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-solidity
      - name: Runtime compiles for the WASM target
        run: |
          rustup target add wasm32v1-none
          # The runtime is a no_std crate: its `std` feature is on by default for the host
          # build, and leaving it on here makes std-only dependencies (e.g. the vendored
          # arrayvec) reach for `std::path` on a target that has no such module.
          cargo check -p pezkuwichain-runtime --locked --target wasm32v1-none \
            --no-default-features

  test-no-try-runtime:
    runs-on: [self-hosted, bizinikiwi-build]
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-solidity
      - name: Tests without the try-runtime feature
        # try-runtime changes which code paths compile; the suite has to pass without it too.
        run: |
          git config --global --add safe.directory '*'
          # Same single exclusion as the `test` job: no cluster, no zombienet. The reason is
          # the runner environment, which does not change with the try-runtime feature.
          cargo nextest run --workspace --locked --no-fail-fast \
            -E 'not (package(pezkuwi-zombienet-sdk))' \
            --features experimental,ci-only-tests \
            --partition count:${{ matrix.partition }}/2 \
            --config-file .config/nextest.toml

  rustdoc:
    runs-on: [self-hosted, bizinikiwi-build]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-solidity
      - name: Build rustdoc
        run: |
          git config --global --add safe.directory '*'
          cargo doc --all-features --workspace --no-deps --locked \
            --exclude pezkuwi-zombienet-sdk-tests \
            --exclude pezpallet-revive-eth-rpc
          rm -f target/doc/.lock

  implementers-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install mdbook
        # The whole toolchain is pinned to the 0.4 line, not just mdbook. Every preprocessor
        # and renderer here speaks a protocol tied to mdbook's version, and book.toml declares
        # all four — an unknown key or a mismatched protocol aborts the render rather than
        # being skipped. The versions below are the last of each that declare `mdbook ^0.4`.
        # graphviz is the `dot` binary mdbook-graphviz shells out to.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq graphviz
          cargo install mdbook --version ^0.4 --quiet
          cargo install mdbook-linkcheck --version ^0.7 --quiet
          cargo install mdbook-graphviz --version ^0.2 --quiet
          cargo install mdbook-mermaid --version ^0.16 --quiet
          cargo install mdbook-last-changed --version ^0.2 --quiet
      - name: Build the implementers guide
        run: mdbook build ./pezkuwi/roadmap/implementers-guide
