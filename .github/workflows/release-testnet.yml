name: release-testnet

# Builds the deployable Zagros (testnet) runtime WASM blobs, records the hashes a
# runtime upgrade has to authorize, and attests build provenance — the same
# discipline as `release.yml`, which only covers mainnet.
#
# Testnet is where a runtime change is proven before it reaches a fund-holding
# chain, so its blobs must be produced by CI from a known commit rather than from
# somebody's laptop. No GitHub release is cut here: these artifacts are consumed
# directly by the upgrade tooling, not published to users.

on:
  push:
    tags:
      - "zagros-*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (defaults to the triggering ref)"
        required: false

permissions:
  contents: read
  actions: write # full-ci-gate may dispatch test.yml
  id-token: write # build-provenance attestation
  attestations: write # build-provenance attestation

concurrency:
  group: release-testnet-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # A runtime WASM must never be built from a commit whose full test suite has not
  # passed. The fast PR gate is deliberately narrow (see 84cd571b) — it is the heavy
  # suite in test.yml that actually exercises the code, and it runs nightly rather
  # than per-PR. So before producing a deployable blob, require a *successful test.yml
  # run for this exact commit*. If there is none, trigger it and stop: the operator
  # re-runs the release once it is green.
  full-ci-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require a green full test suite for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          SHA=$(gh api "repos/${{ github.repository }}/commits/$SHA" --jq .sha)
          echo "commit under release: $SHA"
          CONCLUSION=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/test.yml/runs?head_sha=$SHA&status=completed" \
            --jq '[.workflow_runs[] | select(.conclusion=="success")] | length')
          if [ "$CONCLUSION" -gt 0 ]; then
            echo "full test suite is green for this commit"
            exit 0
          fi
          echo "::error::No successful test.yml run for $SHA."
          echo "Dispatching the full suite now; re-run this release once it is green."
          gh workflow run test.yml --ref "$SHA" || true
          exit 1

  build-runtime:
    needs: full-ci-gate
    # Pinned to the same runner as `release.yml`: these builds are not hermetic
    # yet (pending srtool) and the absolute build path leaks into the WASM, so a
    # fixed runner is what makes the published hash reproducible.
    runs-on: [self-hosted, dks-runner-1]
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - zagros-runtime
          - asset-hub-zagros-runtime
          - people-zagros-runtime
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Toolchain & targets
        run: |
          rustup show
          rustup component add rust-src
          rustup target add wasm32v1-none wasm32-unknown-unknown

      - name: Build deployable runtime WASM (release, locked)
        run: cargo build --release --locked -p ${{ matrix.runtime }}

      - name: Locate WASM and compute upgrade hashes
        id: wasm
        run: |
          set -euo pipefail
          # The compact+compressed blob is the artifact that goes on-chain. The
          # relay's build.rs also emits a `fast-runtime` devnet variant into the
          # same dir for zombienet; never pick that up, and fail loudly on
          # anything else ambiguous rather than taking whichever file `find`
          # happens to return first.
          wbuild_dir="target/release/wbuild/${{ matrix.runtime }}"
          mapfile -t candidates < <(find "$wbuild_dir" -maxdepth 1 \
                 -name '*.compact.compressed.wasm' ! -name 'fast_runtime_binary*')
          if [ "${#candidates[@]}" -eq 0 ]; then
            echo "::error::no compressed WASM found for ${{ matrix.runtime }}"; exit 1
          fi
          if [ "${#candidates[@]}" -gt 1 ]; then
            echo "::error::ambiguous compressed WASM candidates for ${{ matrix.runtime }}: ${candidates[*]}"; exit 1
          fi
          wasm="${candidates[0]}"
          out="artifacts"; mkdir -p "$out"
          base="${{ matrix.runtime }}"
          cp "$wasm" "$out/${base}.compact.compressed.wasm"
          # blake2-256 is the hash an upgrade authorizes (authorize_upgrade).
          b2=$(b2sum -l 256 "$wasm" | cut -d' ' -f1)
          sha=$(sha256sum "$wasm" | cut -d' ' -f1)
          size=$(stat -c%s "$wasm")
          {
            echo "### ${base}"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| commit | \`${GITHUB_SHA}\` |"
            echo "| toolchain | \`$(rustc --version)\` |"
            echo "| size (bytes) | ${size} |"
            echo "| blake2-256 (authorize_upgrade) | \`0x${b2}\` |"
            echo "| sha256 | \`${sha}\` |"
            echo ""
          } > "$out/${base}.digest.md"
          echo "wasm=$out/${base}.compact.compressed.wasm" >> "$GITHUB_OUTPUT"
          echo "blake2_256=0x${b2}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.wasm.outputs.wasm }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.runtime }}
          path: artifacts/*
          if-no-files-found: error

  # A runtime upgrade only needs the WASM, but starting a chain from a fresh
  # genesis needs the processes that run it. The PVF workers are built here too
  # and deliberately shipped as a set: the node refuses to start against workers
  # whose version does not match its own, so they are only ever valid together.
  build-node:
    needs: full-ci-gate
    runs-on: [self-hosted, dks-runner-1]
    strategy:
      fail-fast: false
      matrix:
        package:
          - pezkuwi
          # The package is -bin; `pezkuwi-teyrchain` is the binary it produces, and
          # `cargo build -p pezkuwi-teyrchain` matches no package at all.
          - pezkuwi-teyrchain-bin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Toolchain & targets
        run: |
          rustup show
          rustup component add rust-src
          rustup target add wasm32v1-none wasm32-unknown-unknown

      - name: Build node (release, locked)
        run: cargo build --release --locked -p ${{ matrix.package }}

      - name: Collect binaries and digests
        run: |
          set -euo pipefail
          # `pezkuwi` carries three [[bin]] targets; the two PVF workers are not
          # optional extras but part of the node's execution path.
          case "${{ matrix.package }}" in
            pezkuwi) bins="pezkuwi pezkuwi-execute-worker pezkuwi-prepare-worker" ;;
            pezkuwi-teyrchain-bin) bins="pezkuwi-teyrchain" ;;
            *) echo "::error::unknown package"; exit 1 ;;
          esac
          out=artifacts; mkdir -p "$out"
          {
            echo "### ${{ matrix.package }}"
            echo ""
            echo "| binary | version | sha256 |"
            echo "|---|---|---|"
          } > "$out/${{ matrix.package }}.digest.md"
          for b in $bins; do
            src="target/release/$b"
            [ -x "$src" ] || { echo "::error::missing binary $b"; exit 1; }
            cp "$src" "$out/$b"
            ver=$("$src" --version 2>/dev/null | head -1 || echo "n/a")
            sha=$(sha256sum "$src" | cut -d' ' -f1)
            echo "| \`$b\` | \`$ver\` | \`$sha\` |" >> "$out/${{ matrix.package }}.digest.md"
          done

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/*

      - uses: actions/upload-artifact@v7
        with:
          name: node-${{ matrix.package }}
          path: artifacts/*
          if-no-files-found: error

  # The chain-spec is the genesis contract: once a chain starts, its identity and
  # initial state cannot be edited. Building it in CI from the same commit as the
  # runtime is what keeps "what we tested" and "what we launched" the same thing.
  #
  # Identity matters beyond cosmetics — the node derives the chain it thinks it is
  # from the spec `id` prefix, so the testnet must not carry the mainnet's id.
  chain-specs:
    needs: build-runtime
    runs-on: [self-hosted, dks-runner-1]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/download-artifact@v7
        with:
          pattern: "*-runtime"
          path: wasm
          merge-multiple: true

      - name: Build the chain-spec builder
        run: cargo build --release --locked -p pezstaging-chain-spec-builder

      - name: Generate plain and raw chain-specs
        run: |
          set -euo pipefail
          csb=target/release/pezstaging-chain-spec-builder
          out=chain-specs; mkdir -p "$out"

          # Properties mirror the mainnet chains exactly; only identity differs.
          # Address format, decimals and symbols are what wallets read, and a
          # testnet that renders balances differently stops being a rehearsal.
          gen() {
            local wasm=$1 name=$2 id=$3 props=$4; shift 4
            "$csb" -c "$out/$id.plain.json" create \
              -n "$name" -i "$id" -t live \
              -r "wasm/$wasm" \
              --properties "$props" \
              "$@" named-preset genesis
            "$csb" -c "$out/$id.json" convert-to-raw "$out/$id.plain.json"
            "$csb" verify "$out/$id.json"
            echo "  $id  $(stat -c%s "$out/$id.json") bytes"
          }

          gen zagros-runtime.compact.compressed.wasm \
              "Zagros" zagros "ss58Format=42,tokenDecimals=12,tokenSymbol=HEZ"

          gen asset-hub-zagros-runtime.compact.compressed.wasm \
              "Zagros Asset Hub" asset-hub-zagros \
              "ss58Format=42,tokenDecimals=12,tokenSymbol=TYR" \
              -p 1000 -c zagros

          gen people-zagros-runtime.compact.compressed.wasm \
              "Zagros People" people-zagros \
              "ss58Format=42,tokenDecimals=12,tokenSymbol=TYR" \
              -p 1004 -c zagros

      - name: Assert the specs do not inherit the mainnet identity
        run: |
          set -euo pipefail
          # The live testnet ran for months under the mainnet's chain id, which
          # made the node classify it as the mainnet. Fail the release rather
          # than ship that again.
          python3 - <<'PY'
          import json, sys, pathlib
          expected = {
              "zagros":           ("Zagros",            None,   None),
              "asset-hub-zagros": ("Zagros Asset Hub",  1000,   "zagros"),
              "people-zagros":    ("Zagros People",     1004,   "zagros"),
          }
          bad = []
          for cid, (name, para, relay) in expected.items():
              d = json.load(open(f"chain-specs/{cid}.json"))
              if d.get("id") != cid:
                  bad.append(f"{cid}: id is {d.get('id')!r}")
              if not str(d.get("id", "")).startswith("zagros") and cid == "zagros":
                  bad.append(f"{cid}: id must start with 'zagros' for the node to identify it")
              if d.get("name") != name:
                  bad.append(f"{cid}: name is {d.get('name')!r}")
              if para is not None and d.get("para_id") != para:
                  bad.append(f"{cid}: para_id is {d.get('para_id')!r}")
              if relay is not None and d.get("relay_chain") != relay:
                  bad.append(f"{cid}: relay_chain is {d.get('relay_chain')!r}")
              if "pezkuwichain" in json.dumps({k: d.get(k) for k in ("id", "relay_chain")}):
                  bad.append(f"{cid}: carries a mainnet identity")
              if not d.get("genesis", {}).get("raw"):
                  bad.append(f"{cid}: not a raw spec")
          if bad:
              print("\n".join("::error::" + b for b in bad)); sys.exit(1)
          print("chain-spec identities are correct")
          PY

      - name: Record genesis hashes
        run: |
          set -euo pipefail
          {
            echo "### Zagros chain-specs"
            echo ""
            echo "| chain | id | sha256 |"
            echo "|---|---|---|"
            for f in chain-specs/*.json; do
              case "$f" in *.plain.json) continue ;; esac
              id=$(python3 -c "import json,sys;print(json.load(open('$f'))['id'])")
              echo "| \`$(basename "$f")\` | \`$id\` | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"
            done
          } > chain-specs/digest.md
          cat chain-specs/digest.md

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: chain-specs/*.json

      - uses: actions/upload-artifact@v7
        with:
          name: chain-specs
          path: chain-specs/*
          if-no-files-found: error
