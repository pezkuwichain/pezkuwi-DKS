name: dev-node-image

# The bizinikiwi (kitchensink) `--dev` node image that pezkuwi-apps runs its `.slow.` specs
# against. Those specs take their API types from `api-augment/bizinikiwi` and the static
# bizinikiwi metadata, and the Bounties spec needs the bounties pallet, so `pezkuwi --dev`
# (a different runtime) cannot stand in for it.
#
# The image apps used until now was pushed by hand in 2026-03 and nothing here could rebuild
# it. apps pins the image by digest, so a new push never moves under a running spec; it only
# becomes available to pin.
#
# A pull request that touches the image builds it and starts the node without pushing; the
# schedule and a dispatch publish it.

on:
  schedule:
    - cron: "0 4 * * 0" # weekly Sunday 04:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/dev-node-image.yml
      - docker/dockerfiles/bizinikiwi_injected.Dockerfile

# Read-only unless a job says otherwise; only `image` writes, and only to packages.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  IMAGE: ghcr.io/pezkuwichain/bizinikiwi

jobs:
  binary:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, bizinikiwi-build]
    steps:
      - uses: actions/checkout@v7
      - name: Build bizinikiwi-node
        run: cargo build --locked --release -p pezstaging-node-cli --bin bizinikiwi-node
      - run: |
          mkdir -p artifacts
          cp target/release/bizinikiwi-node artifacts/bizinikiwi
      - uses: actions/upload-artifact@v7
        with:
          name: bizinikiwi
          path: artifacts/bizinikiwi
          retention-days: 3

  image:
    needs: binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: bizinikiwi
          path: artifacts
      - run: chmod +x artifacts/bizinikiwi
      - name: Build image
        run: |
          docker build \
            -f docker/dockerfiles/bizinikiwi_injected.Dockerfile \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg IMAGE_NAME="$IMAGE" \
            -t "$IMAGE:$GITHUB_SHA" .
      # The same invocation apps uses: if the node does not answer here, it would not answer
      # there either, and an image that only builds is not the thing apps needs.
      - name: Start the dev node and query it
        run: |
          docker run -d --name dev-node -p 9944:9944 "$IMAGE:$GITHUB_SHA" --dev --rpc-external --rpc-cors all
          for _ in $(seq 1 60); do
            if out=$(curl -sf -H 'Content-Type: application/json' \
                -d '{"id":1,"jsonrpc":"2.0","method":"state_getMetadata"}' http://127.0.0.1:9944); then
              echo "dev node answers"
              break
            fi
            sleep 2
          done
          test -n "${out:-}" || { docker logs dev-node 2>&1 | tail -40; exit 1; }
          # The Bounties spec is the reason this is kitchensink; fail if the pallet is gone.
          # Pallet names sit in the metadata as SCALE strings: compact length (8 -> 0x20), then
          # the bytes, so `ChildBounties` does not satisfy this.
          echo "$out" | grep -q "20$(printf 'Bounties' | xxd -p)" || { echo "no Bounties pallet"; exit 1; }
          blocks=$(curl -sf -H 'Content-Type: application/json' \
            -d '{"id":1,"jsonrpc":"2.0","method":"chain_getHeader"}' http://127.0.0.1:9944 | jq -r .result.number)
          echo "best block $blocks"
          docker rm -f dev-node
      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
          echo "digest: $(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")" >> "$GITHUB_STEP_SUMMARY"
