name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Supply-chain: RUSTSEC advisories (known CVEs), license policy, banned/duplicate crates.
  cargo-deny:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, licenses, bans, sources]
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}

  # The tools under tools/ declare their own [workspace], so the run above never reaches their
  # dependency graphs. That is not a small gap: the bridge tooling was carrying a `bytes`
  # integer overflow and a `time` stack-exhaustion DoS, and nothing here would have said so.
  # Same policy file, so the ignore list stays single-sourced.
  cargo-deny-tools:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest: [tools/usdt-bridge/Cargo.toml, tools/chain-spec-tool/Cargo.toml]
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ${{ matrix.manifest }}
          command: check advisories
          # The action runs cargo-deny inside a container where the checkout is mounted at
          # /github/workspace, so the policy is named by that path rather than the runner's.
          arguments: --config /github/workspace/deny.toml
    # cargo-deny "advisories" uses the same RUSTSEC database as cargo-audit and is the
    # single source of truth for the ignore policy (see deny.toml). A separate cargo-audit
    # job is intentionally omitted to avoid maintaining two divergent ignore lists.

  # What cargo-deny does not cover, and it is two different gaps.
  #
  # RustSec does not carry every advisory -- `yamux 0.12.1` has a remote-panic GHSA and no
  # RustSec entry, so no configuration of cargo-deny could find it. And on 2026-09-01 cargo-deny
  # was silent on advisories it *did* have: `hickory-proto 0.24.4` in the graph, the advisory in
  # the database it had just fetched, not ignored, and no diagnostic. It still reported the
  # unmaintained class that same run, so the tool works -- the vulnerability class does not
  # reach the output, and why is an open item.
  #
  # `dependency-review` above uses GitHub's database but only reads what a PR adds, so it says
  # nothing about the tree already here. This audits the resolved graph.
  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Every resolved crate, against GHSA and RustSec together
        run: python3 .github/scripts/check-osv-advisories.py --verbose

  # Block PRs that introduce dependencies with known vulnerabilities or bad licenses.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          # The policy, and the reasoning for it, live in the config file.
          config-file: ./.github/dependency-review-config.yml

  # OpenSSF Scorecard — supply-chain security posture of the repo itself.
  scorecard:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
