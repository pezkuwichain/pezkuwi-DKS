# Asking for a weights measurement.
#
# Editing this file and pushing runs the `weights` workflow on the reference host. Nothing
# else triggers it, and no ordinary commit touches this file. The request stays in git, so
# what was measured -- and why -- is answerable later from the history rather than from
# somebody's shell.
#
# Each entry may set `runtime`, `pallet`, `repeat`, `steps` and `why`. Leave `runtime` or
# `pallet` out to mean "all of them", which takes many hours.
#
# `repeat` is the knob that decides whether a fitted weight is a measurement or a draw.
# `enqueue_n_full_pages` has a steep slope over a wide component range, so the intercept is
# poorly determined and the default 20 samples do not pin it down: seven runtimes came back
# with a base up to twelve times their own recorded minimum, and 100 fixed them.
#
# Both twins, always. Measuring one and not the other is how they drift, and `check-twin-
# runtimes.py` compares pallet indices, not weights -- nothing else would catch it.

# 2026-08-29, three asks. The first two measured nothing -- the reference host had no cargo on
# PATH, then no solc; both were things this workflow had never run long enough to discover.
#
# The third measured, at `--repeat 100`, and the numbers say something worth writing down: it
# did not simply improve the fit. `bridge-hub-pezkuwichain` went from 22% out to 13.2%, and
# `bridge-hub-zagros` went the other way, from 7.2% -- passing -- to 19.1%. Between the two
# runs `enqueue_n_full_pages`'s fitted base moved 47% on zagros and the directly measured
# `enqueue_1000_small_xcmp_messages` moved 26%. That is not a fit converging; that is scatter
# larger than the 15% the pallet's own check allows, on this hardware, for this pallet.
#
# It is not extrapolation: `enqueue_empty_xcmp_message_at` samples the whole component range
# and the check evaluates it mid-range. So the fourth ask is 200 -- the number that settled
# `asset-hub-pezkuwichain` when 100 was not enough. If both twins do not land inside 15% at
# 200, the answer is not a fifth run: it is that this box cannot resolve this pallet to that
# tolerance, and that is a finding rather than a knob.

# 2026-08-30: both asks were measured and the files are in the tree, so the list is empty.
# An empty list is the finished state, not a broken one -- a request that stays after it has
# been answered re-runs on the reference host at every push, which is what this comment
# replaced. `weights_request.py` refuses an empty `runs:` and the workflow only fires when
# this file changes, so nothing runs until somebody asks for something.

# 2026-08-31, second ask. The first one measured and six of this pallet's sixteen benchmarks
# did not execute -- which is the useful result, because it means the recorded weights for
# those six could not be regenerated by anybody.
#
# Two were this branch's: `pay_airdrop` and `execute_presale` send an XCM, and a benchmark
# genesis has no HRMP channel, so the router refused and the call reported
# `CouldNotReachTreasury` -- correctly. Four predate it: `register_candidate` never recorded
# the endorsements its own check requires, `cast_vote` and `finalize_election` inherited that
# through their setup, and `approve_appointment` seated a nominee with no citizen NFT.
# `finalize_election` had a second fault underneath the first: it handed `Root` to a call that
# takes a signed origin, so it would have failed with `BadOrigin` even once the setup worked.
#
# `finalize_election` was also measuring one candidate. The count walks the candidate list and
# the list is bounded at five hundred, so one candidate priced the worst case at a five
# hundredth of it. It measures five hundred now.
#
# All sixteen execute against the mock (`cargo test --features runtime-benchmarks bench`).
# This asks the reference host for the real numbers, both twins.
#
# 2026-10-03: the unsigned election miner now submits two pages instead of thirty-two
# (`MinerPages`). `submit_unsigned` mines exactly that many pages, so its thirty-two-page
# measurement -- 12 MB of proof against the 10 MiB `MAX_POV_SIZE` -- no longer describes the call and is
# what `runtime_integrity_tests` refuses. Only this pallet's file depends on `MinerPages`.
#
# Measured the same day (run 37067510936, reference box): two pages cost 6.6 ms and 417 KB of
# proof, inside the block on both twins. The files are in the tree, so the list is empty again.
#
# 2026-10-08: `pezpallet_komite` is new on both Asset Hubs (index 71). Its one call,
# `set_committee`, stores a committee of up to `MAX_COMMITTEE` (64) members; the recorded
# weight is a placeholder sized above the work until this measures it.
#
# Asked twice: the first run (37798217660) could not build the development preset's genesis --
# its synthetic validators bonded below the new 10,000 HEZ floor -- fixed in the commit before.
# Measured (run 37817572382): ~90 us plus ~11 us and one read per member, well above the
# placeholder. The files are in the tree.
#
# 2026-10-09: `pezpallet_tnpos` on both People twins. `note_bonded` (the Asset Hub's bond report,
# spec C4) has never been measured -- its weight is a ceiling -- and `seat_committee` now checks
# every candidate against a full bond report, which its last measurement did not include.
runs:
  - runtime: people-pezkuwichain
    pallet: pezpallet_tnpos
    why: note_bonded never measured; seat_committee now reads the bond report
  - runtime: people-zagros
    pallet: pezpallet_tnpos
    why: note_bonded never measured; seat_committee now reads the bond report
