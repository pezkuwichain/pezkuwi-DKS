# Configuration for actions/dependency-review-action.
#
# Why the allow-list below exists
# -------------------------------
# dependency-review resolves a package's licence from GitHub's dependency graph, not from the
# crate's own manifest. Our crates are published to crates.io with their licence set -- measured:
# 348 Apache-2.0, 241 GPL-3.0-or-later WITH Classpath-exception-2.0, 13 MIT-0, 12 Unlicense, and
# every one of those is in deny.toml's allow list -- but the graph has not indexed them, so all
# 408 of them came back "unknown licence" on every pull request.
#
# That is not a finding, it is 95% of the report. A warning that large hides the part that is
# real: the same run flagged four Python CI tools, one of them LGPL, which is genuinely not in
# our allow list. Nobody would have seen it under four hundred lines of our own crate names.
#
# So the licence check stays ON -- it is the only gate covering npm, PyPI and actions, which
# cargo-deny does not see -- and our own crates are excluded from it. cargo-deny already checks
# them against the real manifests and passes.
#
# Keys here are kebab-case, matching the action's inputs. They were snake_case first, and the
# action accepted the file, ran green and ignored every one of them -- a config that parses and
# does nothing looks exactly like a config that works.
#
# Regenerate after changing umbrella/Cargo.toml:
#   python3 -c "import re;print('\n'.join(sorted(set('  - pkg:cargo/'+m for m in re.findall(r'^\[dependencies\.([A-Za-z0-9][A-Za-z0-9_-]*)\]', open('umbrella/Cargo.toml').read(), re.M)))))"

fail-on-severity: high

# Put the verdict on the pull request, not only in the job summary. The unknown-licence
# count is the thing this file exists to keep readable, and it is worth seeing where it was
# first noticed.
comment-summary-in-pr: on-failure

allow-dependencies-licenses:
  # Not ours, but measured and allowed by name rather than left to the graph. Each of these
  # publishes a licence we accept; the graph reports null because it cannot resolve them, not
  # because anything is missing. Verified 2026-08-19:
  #
  #   ark-vrf MIT · aws-lc-sys ISC/Apache-2.0/MIT/BSD-3-Clause · litep2p MIT
  #   w3f-pcs, w3f-plonk-common, w3f-ring-proof MIT/Apache-2.0
  #   const-crypto MIT OR Apache-2.0 · time-macros MIT OR Apache-2.0
  #   @polkadot-labs/hdkd MIT · polkadot-api MIT · @pezkuwi/api, @pezkuwi/util Apache-2.0
  #
  # cargo-deny checks the Rust ones against their real manifests on every run and passes, so
  # they are covered by a gate that can actually read them. The npm ones are not covered by
  # anything else, which is why they are named here individually rather than the ecosystem
  # being switched off.
  #
  # PyGithub is deliberately NOT listed. It is LGPL -- the only copyleft in our CI tooling and
  # the one licence here outside deny.toml's allow list -- and it reports null only because the
  # package leaves its metadata licence field empty and states LGPL in a classifier instead.
  # Leaving it visible costs one warning line and keeps the fact in view.
  - pkg:cargo/ark-vrf
  - pkg:cargo/aws-lc-sys
  - pkg:cargo/const-crypto
  - pkg:cargo/litep2p
  - pkg:cargo/time-macros
  - pkg:cargo/w3f-pcs
  - pkg:cargo/w3f-plonk-common
  - pkg:cargo/w3f-ring-proof
  - pkg:npm/%40pezkuwi/api
  - pkg:npm/%40pezkuwi/util
  - pkg:npm/%40polkadot-labs/hdkd
  - pkg:npm/polkadot-api
  # GitHub's own actions, MIT, licence file present in each repo. The graph reports null
  # because a floating major tag (@v7) does not resolve to a release it can look up.
  - pkg:githubactions/actions/checkout
  - pkg:githubactions/actions/setup-python
  - pkg:githubactions/actions/upload-artifact
